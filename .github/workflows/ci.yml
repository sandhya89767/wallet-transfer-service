name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and PostgreSQL concurrency tests
        run: ./mvnw --batch-mode verify
      - name: HTTP runner retry unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build container
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Live HTTP acceptance bursts
        run: ./scripts/burst.sh all
      - name: Capture logs and metrics
        if: always()
        run: |
          mkdir -p target/evidence
          docker compose logs --no-color --no-log-prefix app > target/evidence/app.jsonl
          curl --fail --silent http://localhost:8080/metrics > target/evidence/metrics.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/evidence/
      - name: Stop containers
        if: always()
        run: docker compose down